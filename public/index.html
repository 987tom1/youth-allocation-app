    toast('Settings saved');
  } catch (e) { toast(e.message); }
}

async function adminAction(path, msg) {
  try { await API.post(path, {}); toast(msg); go('home'); } catch (e) { toast(e.message); }
}

// Account modals
// Change 6: auto-suggest email on account creation
function suggestEmail() {
  const role = document.getElementById('u-role')?.value;
  const emailEl = document.getElementById('u-email');
  if (!emailEl) return;
  let suggested = '';
  if (role === 'grade') {
    const grade = document.getElementById('u-grade')?.value;
    if (grade) suggested = `grade${grade}@youth.ministry`;
  } else if (role === 'quad') {
    const quad = document.getElementById('u-quad')?.value;
    if (quad) suggested = `${quad}@youth.ministry`;
  } else if (role === 'director') {
    suggested = 'director@youth.ministry';
  } else if (role === 'admin') {
    suggested = 'admin@youth.ministry';
  }
  if (suggested) emailEl.value = suggested;
}

function showAddUser() {
  modal(`
    <div class="mo-title">Add Account</div>
    <div id="uerr"></div>
    <div class="fg"><label class="fl">Display Name</label><input class="fi" id="u-name" placeholder="Grade 9"></div>
    <div class="fg"><label class="fl">Email</label><input class="fi" id="u-email" type="email" placeholder="grade9@youth.ministry"></div>
    <div class="fg"><label class="fl">Password</label><input class="fi" id="u-pw" type="password" placeholder="Min 6 chars"></div>
    <div class="fg"><label class="fl">Role</label>
      <select class="fs" id="u-role" onchange="toggleUserRoleFields();suggestEmail()">
        <option value="grade">Grade</option>
        <option value="quad">Quad</option>
        <option value="director">Director</option>
        <option value="admin">Admin</option>
      </select>
    </div>
    <div id="u-grade-f" class="fg">
      <label class="fl">Grade</label>
      <select class="fs" id="u-grade" onchange="suggestEmail()">${[7,8,9,10,11,12].map(g=>`<option value="${g}">${g}</option>`).join('')}</select>
    </div>
    <div id="u-quad-f" class="fg" style="display:none">
      <label class="fl">Quad</label>
      <select class="fs" id="u-quad" onchange="suggestEmail()">
        <option value="g79">Girls Yr 7–9</option><option value="b79">Boys Yr 7–9</option>
        <option value="g1012">Girls Yr 10–12</option><option value="b1012">Boys Yr 10–12</option>
      </select>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" style="flex:1" onclick="submitAddUser()">Create</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    </div>`);
  // Trigger initial email suggestion for default role (grade)
  suggestEmail();
}

function toggleUserRoleFields() {
  const role = document.getElementById('u-role')?.value;
  document.getElementById('u-grade-f').style.display = role==='grade'?'block':'none';
  document.getElementById('u-quad-f').style.display = role==='quad'?'block':'none';
}

async function submitAddUser() {
  const displayName = document.getElementById('u-name')?.value?.trim();
  const email = document.getElementById('u-email')?.value?.trim();
  const password = document.getElementById('u-pw')?.value;
  const role = document.getElementById('u-role')?.value;
  const grade = role==='grade' ? parseInt(document.getElementById('u-grade')?.value||'7',10) : null;
  const quad = role==='quad' ? document.getElementById('u-quad')?.value : null;
  const errEl = document.getElementById('uerr');
  if (!displayName || !email || !password) { errEl.innerHTML='<div class="alert al-err">All fields required</div>'; return; }
  try {
    await API.post('/accounts/users', { displayName, email, password, role, grade, quad });
    closeModal(); toast('Account created'); await renderAdmin();
  } catch (e) { errEl.innerHTML=`<div class="alert al-err">${e.message}</div>`; }
}

async function showEditUser(id) {
  let u; try { u = (await API.get('/accounts/users')).find(x => x.id===id); } catch {}
  if (!u) { toast('User not found'); return; }
  modal(`
    <div class="mo-title">Edit Account</div>
    <div id="uerr"></div>
    <div class="fg"><label class="fl">Display Name</label><input class="fi" id="u-name" value="${u.displayName}"></div>
    <div class="fg"><label class="fl">Role</label>
      <select class="fs" id="u-role" onchange="toggleUserRoleFields()">
        ${['grade','quad','director','admin'].map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${r.charAt(0).toUpperCase()+r.slice(1)}</option>`).join('')}
      </select>
    </div>
    <div id="u-grade-f" class="fg" style="${u.role!=='grade'?'display:none':''}">
      <label class="fl">Grade</label>
      <select class="fs" id="u-grade">${[7,8,9,10,11,12].map(g=>`<option value="${g}" ${g===u.grade?'selected':''}>${g}</option>`).join('')}</select>
    </div>
    <div id="u-quad-f" class="fg" style="${u.role!=='quad'?'display:none':''}">
      <label class="fl">Quad</label>
      <select class="fs" id="u-quad">${['g79','b79','g1012','b1012'].map(q=>`<option value="${q}" ${q===u.quad?'selected':''}>${QUAD_LABELS[q]||q}</option>`).join('')}</select>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" style="flex:1" onclick="submitEditUser('${id}')">Save</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    </div>`);
}

async function submitEditUser(id) {
  const displayName = document.getElementById('u-name')?.value?.trim();
  const role = document.getElementById('u-role')?.value;
  const grade = role==='grade' ? parseInt(document.getElementById('u-grade')?.value||'7',10) : null;
  const quad = role==='quad' ? document.getElementById('u-quad')?.value : null;
  try {
    await API.patch(`/accounts/users/${id}`, { displayName, role, grade, quad });
    closeModal(); toast('Account updated'); await renderAdmin();
  } catch (e) { document.getElementById('uerr').innerHTML=`<div class="alert al-err">${e.message}</div>`; }
}

function showSetPassword(id, name) {
  modal(`
    <div class="mo-title">Reset Password</div>
    <p style="color:var(--ink-mid);margin-bottom:14px">Set a new password for <strong>${name}</strong></p>
    <div id="uerr"></div>
    <div class="fg"><label class="fl">New Password (min 6 chars)</label><input class="fi" id="u-newpw" type="password" placeholder="New password"></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" style="flex:1" onclick="submitSetPassword('${id}')">Set Password</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    </div>`);
}

async function submitSetPassword(id) {
  const password = document.getElementById('u-newpw')?.value;
  if (!password || password.length < 6) { document.getElementById('uerr').innerHTML='<div class="alert al-err">Password must be at least 6 characters</div>'; return; }
  try {
    await API.post('/accounts/users/password', { id, password });
    closeModal(); toast('Password updated');
  } catch (e) { document.getElementById('uerr').innerHTML=`<div class="alert al-err">${e.message}</div>`; }
}

async function toggleUserStatus(id, currentStatus) {
  try {
    await API.patch(`/accounts/users/${id}/status`, {});
    toast(currentStatus==='active' ? 'Account deactivated' : 'Account activated');
    await renderAdmin();
  } catch (e) { toast(e.message); }
}

function confirmDelUser(id, name) {
  modal(`<div class="mo-title">Delete Account?</div>
    <p style="color:var(--ink-mid);margin-bottom:20px">Delete account for <strong>${name}</strong>?</p>
    <div style="display:flex;gap:8px">
      <button class="btn btn-danger" style="flex:1" onclick="API.del('/accounts/users/${id}').then(()=>{closeModal();toast('Account deleted');renderAdmin()}).catch(e=>toast(e.message))">Delete</button>
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
    </div>`);
}

// ============================================================
// BOOT
// ============================================================
async function boot() {
  const token = localStorage.getItem('yap_token');
  if (token) {
    try { const user = await API.get('/auth/me'); S.user = user; } catch { API.setToken(null); }
  }
  restoreAllocFilters();
  restoreArFilter();
  if (S.user) {
    try { S.settings = await API.get('/settings'); } catch { S.settings = {}; }
  }
  render();
}

boot();
